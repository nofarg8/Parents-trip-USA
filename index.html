<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<body>
<header class="top">
  <div class="brand">
    <div class="brand-title">מפת הזיכרונות</div>
    <div class="brand-sub">איתי וענת · מהחוף המערבי למזרחי · 22.9-18.10.2026</div>
  </div>
  <div class="top-actions">
    <span class="stat" id="stat"></span>
    <button class="btn primary" id="tourBtn">▶ סיור במפה</button>
    <button class="btn ghost" id="daysBtn" aria-label="רשימת הימים">📅 הימים</button>
  </div>
</header>

<main class="layout">
  <aside class="days" id="days" aria-label="ימי הטיול"></aside>
  <div id="map" role="application" aria-label="מפה"></div>
  <section class="card hidden" id="card" aria-live="polite">
    <button class="card-close" id="cardClose" aria-label="סגירה">✕</button>
    <div class="card-day" id="cardDay"></div>
    <h2 class="card-title" id="cardTitle"></h2>
    <div class="card-sub" id="cardSub"></div>
    <div class="gallery" id="gallery"></div>
    <div class="texts" id="texts"></div>
    <div class="card-nav">
      <button class="btn ghost" id="prevBtn">‹ הקודם</button>
      <button class="btn ghost" id="nextBtn">הבא ›</button>
    </div>
  </section>
</main>

<div class="tourbar hidden" id="tourbar">
  <button class="btn ghost" id="tourPrev">‹</button>
  <button class="btn primary" id="tourPause">⏸ השהיה</button>
  <button class="btn ghost" id="tourNext">›</button>
  <span class="tour-pos" id="tourPos"></span>
  <button class="btn ghost" id="tourStop">✕ יציאה</button>
</div>

<div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-close" id="lbClose" aria-label="סגירה">✕</button>
  <button class="lb-arrow lb-prev" id="lbPrev" aria-label="הקודמת">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-arrow lb-next" id="lbNext" aria-label="הבאה">›</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<script src="app.js?v=10"></script>
</body>
</html>
